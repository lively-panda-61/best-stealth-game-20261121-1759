<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Protocol — a stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090e; }
  body { display: flex; flex-direction: column; align-items: center; font-family: system-ui, sans-serif; }
  #hud {
    width: 960px; max-width: 100vw; box-sizing: border-box;
    display: flex; gap: 18px; align-items: center; padding: 10px 12px;
    color: #e5e7eb; font-size: 14px; background: #0b0e14;
  }
  #hud .spacer { flex: 1; }
  #hud-alert { font-weight: 700; }
  #hud-objective { color: #9ca3af; font-size: 13px; }
  #game { width: 960px; max-width: 100vw; height: auto; display: block; touch-action: none; background: #12161f; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="hud">
  <strong id="hud-level">Level 1</strong>
  <span id="hud-cores">◆ 0/3 cores</span>
  <span id="hud-alert">○ Unseen</span>
  <span id="hud-time">0.0s</span>
  <span class="spacer"></span>
  <span id="hud-objective">Lift every core, then reach the exit</span>
</div>
<canvas id="game" width="960" height="600" aria-label="Shadow Protocol: a top-down stealth game. Move with WASD, sneak with Shift, lift every data core and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
